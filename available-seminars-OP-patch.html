<!-- ---------------------------------------------------------------------------
     STEP 1 — add ONE line to the hidden merge feed inside the card markup,
     next to the existing .mf-desc span. Build the token with the block's field
     PICKER (do not hand-type it) so the Event->Course relationship resolves.
     Course Short Description is the new field the AI automation writes.
     If the field is empty the card silently falls back to the long description,
     so this is safe to add before the automation runs.
--------------------------------------------------------------------------- -->
<span class="mf-descshort" style="display:none">[Block//Course//Course Short Description]</span>


<!-- ---------------------------------------------------------------------------
     STEP 2 — append this <style> to the block. Rules are prefixed `body` on
     purpose: a duplicate Block 2 has shipped on this page before and plain
     .sem-card rules lost the specificity fight.
--------------------------------------------------------------------------- -->
<style>
/* ---- coral headline: thinner, and stepped down so long names stay in the photo ----
   Kate: "the words Excellence and Commitment ... thinner and more to scale in the space".
   available-seminars.js stamps data-len (s/m/l/xl) from the headline's character count,
   so BREAKTHROUGHS: LIVING OUTSIDE THE BOX drops a size instead of overflowing. */
body .sem-card .fc-eyebrow{
  font-weight:600;                 /* was 800 */
  letter-spacing:.035em;
  line-height:1.12;
  margin:0 auto 8px;
  max-width:94%;
  overflow-wrap:break-word;
  text-wrap:balance;
}
body .sem-card .fc-eyebrow[data-len="s"]{  font-size:22px; }
body .sem-card .fc-eyebrow[data-len="m"]{  font-size:20px; }
body .sem-card .fc-eyebrow[data-len="l"]{  font-size:17px; }
body .sem-card .fc-eyebrow[data-len="xl"]{ font-size:15px; letter-spacing:.02em; }

/* ---- the white subtext under the headline ----
   On the live page this line was rendering coral, so the pair read as one orange
   slab (see the Breakthroughs card). Pin it white and lighten it. */
body .sem-card .fc-title{
  color:#ffffff !important;
  font-weight:500;                 /* was 700 */
  font-size:16px;
  line-height:1.35;
  margin:0 auto;
  max-width:96%;
  text-wrap:balance;
}
body .card-grid.designated .sem-card .fc-title{ font-size:17px; }

/* a touch more breathing room around the pair */
body .sem-card .flip-cap{ padding:18px 20px; }

/* ---- date line: keep the compact list to two lines, never let it push the card ---- */
body .sem-card .sem-when .when-dates{
  font-size:12.5px;
  line-height:1.5;
  overflow-wrap:break-word;
}

/* ---- flip-back once Course Short Description is populated ----
   The gradient fade currently on the back exists only to cut off the long
   rich-text description. A one-sentence blurb should sit centred, unfaded —
   the JS adds .has-short-desc to any card that used the short field, so cards
   still on the long description keep the fade. */
body .sem-card.has-short-desc .flip-back::after{ content:none !important; }
body .sem-card.has-short-desc .flip-back{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  padding:20px 24px !important;
}
body .sem-card.has-short-desc .flip-back p{
  font-size:14px !important;
  line-height:1.6 !important;
  text-align:center !important;
  color:#ffffff !important;
  -webkit-line-clamp:none !important;
  max-height:none !important;
}
body .sem-card.has-short-desc .flip-back p strong{ font-weight:800 !important; }
</style>
